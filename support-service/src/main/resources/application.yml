server:
  port: 8089

spring:
  application:
    name: support-service
  datasource:
    url: ${DB_URL_SUPPORT:jdbc:postgresql://localhost:5433/qualiapproche_support}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
