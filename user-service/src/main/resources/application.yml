server:
  port: 8090

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bd_quali_sira_user}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URI:http://localhost:8080/realms/quali}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:tachquali@gmail.com}
    password: ${MAIL_PASSWORD:qpkcnamwhjfkundy}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}

keycloak:
  realm: ${KC_REALM:quali}
  serverUrl: ${KC_SERVER_URL:http://localhost:8080}
  clientId: ${KC_CLIENT_ID:quali-sira}
  clientSecret: ${KC_CLIENT_SECRET:soQD0CdF706iM7sRhh4AsPV4JbmopEqZ}
  issuerUri: ${KC_ISSUER_URI:http://localhost:8080/realms/quali}
  tokenUri: ${KC_TOKEN_URI:http://localhost:8080/realms/quali/protocol/openid-connect/token}
  adminUsername: ${KC_ADMIN_USERNAME:admin}
  adminPassword: ${KC_ADMIN_PASSWORD:admin}