<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Rapport d'audit en attente de votre signature</title>
</head>
<body style="margin:0;padding:24px;background:#F4F6FA;font-family:Arial,Helvetica,sans-serif;color:#1F2937;">
<div style="max-width:640px;margin:0 auto;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;padding:24px;">
    <p style="margin:0 0 16px;" th:text="'Bonjour ' + ${nomComplet} + ','">Bonjour,</p>
    <p style="margin:0 0 16px;">
        Le rapport de l'audit <strong th:text="${reference}">AUD-2026-001</strong>
        <span th:if="${referenceRapport}">(<span th:text="${referenceRapport}">RAP-2026-001</span>)</span>
        attend votre visa<span th:if="${role}"> — <strong th:text="${role}">Approuvé par</strong></span>.
    </p>
    <p style="margin:0 0 16px;" th:if="${relancePar}">
        Relance de <strong th:text="${relancePar}">Responsable d'équipe</strong>.
    </p>
    <p style="margin:20px 0 0;" th:if="${lien}">
        <a th:href="${lien}" style="color:#2E5EAA;">Ouvrir le rapport dans QUALI-SIRA</a>
    </p>
</div>
</body>
</html>
