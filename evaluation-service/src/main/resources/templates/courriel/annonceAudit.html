<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Audit</title>
</head>
<body style="margin:0;padding:24px;background:#F4F6FA;font-family:Arial,Helvetica,sans-serif;color:#1F2937;">
<div style="max-width:640px;margin:0 auto;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;padding:24px;">
    <p style="margin:0 0 16px;" th:text="'Bonjour ' + ${nomComplet} + ','">Bonjour,</p>
    <p style="margin:0 0 16px;" th:if="${geste == 'VALIDATION'}">
        L'audit <strong th:text="${reference}">AUD-2026-001</strong> du processus
        <strong th:text="${processus}">Processus</strong> est validé<span th:if="${debut}">, prévu
        du <strong th:text="${debut}">01/01/2026</strong> au <strong th:text="${fin}">02/01/2026</strong></span>.
    </p>
    <p style="margin:0 0 16px;" th:if="${geste == 'PARTAGE_PLAN'}">
        Le plan de l'audit <strong th:text="${reference}">AUD-2026-001</strong> du processus
        <strong th:text="${processus}">Processus</strong> vous est partagé<span th:if="${debut}"> : l'audit se tiendra
        du <strong th:text="${debut}">01/01/2026</strong> au <strong th:text="${fin}">02/01/2026</strong></span>.
    </p>
    <p style="margin:0 0 16px;color:#6B7280;font-size:13px;" th:text="'Vous êtes prévenu(e) en tant que : ' + ${titre} + '.'">Titre</p>
    <p style="margin:20px 0 0;" th:if="${lien}">
        <a th:href="${lien}" style="color:#2E5EAA;">Consulter l'audit dans QUALI-SIRA</a>
    </p>
</div>
</body>
</html>
