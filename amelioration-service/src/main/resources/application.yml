server:
  port: 8083

spring:
  application:
    name: amelioration-service
  datasource:
    url: jdbc:postgresql://localhost:5433/qualiapproche_amelioration
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/quali

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

docs:
  pj:
    directory: ${DOCS_PJ_DIRECTORY:${user.home}/PIECES_JOINTES}
