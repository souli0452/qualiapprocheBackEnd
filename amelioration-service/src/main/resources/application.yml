server:
  port: 8083

spring:
  application:
    name: amelioration-service
  datasource:
    url: ${DB_URL_AMELIORATION:jdbc:postgresql://localhost:5432/qualisira_amelioration}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URI:http://localhost:8080/realms/quali}
      client:
        registration:
          keycloak:
            client-id: ${KC_CLIENT_ID:quali-sira}
            client-secret: ${KC_CLIENT_SECRET:URd095w8aGdw1wJ53HLDd1cxkvJEJReC}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KC_TOKEN_URI:http://localhost:8080/realms/quali/protocol/openid-connect/token}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:tachquali@gmail.com}
    password: ${MAIL_PASSWORD:qpkcnamwhjfkundy}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Serveur d'objets commun à la plateforme : mêmes coordonnées que support-service, le bucket
# est partagé et les modules s'y distinguent par le préfixe de dossier.
minio:
  url: ${MINIO_URL:https://s3.horeb.tech}
  access-key: ${MINIO_ACCESS_KEY:qualisira_admin_minio}
  secret-key: ${MINIO_SECRET_KEY:qualisira_admin_password}
  bucket-name: ${MINIO_BUCKET_NAME:quali-sira}

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}