name: Deploy Planification Service

on:
  push:
    branches:
      - test

    paths:
      - 'planification-service/**'
      # Les DTO, énumérations et gabarits partagés vivent dans common : une modification du
      # module commun doit redéployer le service, faute de quoi il continue de tourner sur
      # l'ancienne version du contrat.
      - 'common/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Vérifier le style de code (Checkstyle)
        run: mvn -B checkstyle:check -pl planification-service -am

      - name: Build planification-service
        run: mvn clean install -pl planification-service -am -DskipTests -Dcheckstyle.skip=true

      - name: Trigger Coolify Deployment
        run: |
          echo "Calling Coolify webhook..."

          # Ajout du header Authorization avec le token
          response=$(curl -s -o response.txt -w "%{http_code}" \
          -X GET "${{ secrets.PLANIFICATION_WEBHOOK }}" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          echo "HTTP Status: $response"
          echo "Response:"
          cat response.txt
          if [ "$response" -ne 200 ]; then
            echo "Deployment webhook failed!"
            exit 1
          fi
          echo "Deployment triggered successfully!"