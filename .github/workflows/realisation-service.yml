name: Deploy Realisation Service

on:
  push:
    branches:
      - develop

    paths:
      - 'realisation-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build realisation-service
        run: mvn clean install -pl realisation-service -am -DskipTests

      - name: Trigger Coolify Deployment
        run: |
          echo "Calling Coolify webhook..."

          # Ajout du header Authorization avec le token
          response=$(curl -s -o response.txt -w "%{http_code}" \
          -X GET "${{ secrets.REALISATION_WEBHOOK }}" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          echo "HTTP Status: $response"
          echo "Response:"
          cat response.txt
          if [ "$response" -ne 200 ]; then
            echo "Deployment webhook failed!"
            exit 1
          fi
          echo "Deployment triggered successfully!"