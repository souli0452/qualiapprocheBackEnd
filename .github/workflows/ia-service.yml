name: Deploy IA Service

on:
  push:
    branches:
      - test

    paths:
      - 'ia-service/**'
      # Les DTO, énumérations et contrats partagés vivent dans common : une modification du
      # module commun doit redéployer le service, faute de quoi il continue de tourner sur
      # l'ancienne version du contrat.
      - 'common/**'
      - 'Dockerfile.ia'
      - '.github/workflows/ia-service.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Vérifier le style de code (Checkstyle)
        run: mvn -B checkstyle:check -pl ia-service -am

      - name: Build ia-service
        run: mvn clean install -pl ia-service -am -DskipTests -Dcheckstyle.skip=true

      - name: Trigger Coolify Deployment
        env:
          WEBHOOK: ${{ secrets.IA_WEBHOOK }}
        run: |
          # Le secret n'existe pas encore : l'assistant est en ligne, mais son application
          # Coolify n'a pas de webhook déclaré ici. Sans cette garde, l'appel partait vers une
          # URL vide et faisait échouer l'action — donc un rouge permanent sur une compilation
          # et trente-huit tests qui, eux, passent. On le dit et on s'arrête là : le jour où le
          # secret est posé, le déploiement repart sans rien changer d'autre.
          if [ -z "$WEBHOOK" ]; then
            echo "IA_WEBHOOK absent : rien n'a été déployé."
            echo "Pour automatiser : Coolify > application ia-service > Webhooks, puis poser"
            echo "l'URL en secret GitHub nommé IA_WEBHOOK."
            exit 0
          fi

          echo "Calling Coolify webhook..."

          # Ajout du header Authorization avec le token
          response=$(curl -s -o response.txt -w "%{http_code}" \
          -X GET "$WEBHOOK" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          echo "HTTP Status: $response"
          echo "Response:"
          cat response.txt
          if [ "$response" -ne 200 ]; then
            echo "Deployment webhook failed!"
            exit 1
          fi
          echo "Deployment triggered successfully!"
