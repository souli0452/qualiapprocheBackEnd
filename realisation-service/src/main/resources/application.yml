server:
  port: 8082

spring:
  application:
    name: realisation-service
  datasource:
    url: ${DB_URL_REALISATION:jdbc:postgresql://localhost:5432/bd_quali_sira_realisation}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    # Journalisation des requêtes : coupée par défaut. Chaque requête y passait avec ses
    # valeurs — donc des données de dossiers dans les journaux, et un volume qui noie les
    # lignes qui comptent. Pour déboguer en local : SPRING_JPA_SHOW_SQL=true.
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URI:http://localhost:8080/realms/quali}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true