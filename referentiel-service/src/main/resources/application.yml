server:
  port: 8090
spring:
  application:
    name: referentiel-service
  servlet:
    # Pièces jointes de la FAQ : ReglesDePieceJointe admet 25 Mo par fichier ; le défaut de Spring
    # (1 Mo) les refusait avant même la règle.
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB
  datasource:
    url: ${DB_URL_REFERENTIEL:jdbc:postgresql://localhost:5432/bd_quali_sira_referentiel}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    # Sous spring.datasource, où Hikari la lit : écrite sous spring.jpa, elle était ignorée, et chaque
    # service ouvrait 10 connexions — 70 pour la pile, contre max_connections = 100 sur PostgreSQL.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Une base déjà en service n'est pas vide : Flyway la marque « v1 » au lieu de rejouer
    # le schéma initial, qui échouerait sur des tables existantes. Une base vide, elle,
    # reçoit V1 puis la suite. Les deux convergent ensuite.
    baseline-on-migrate: true
    baseline-version: 1
    # Sans apostrophe : Flyway interpole cette description dans le SQL qui inscrit la
    # ligne de référence, et une apostrophe y casse la migration au premier démarrage.
    baseline-description: Schema initial releve avant la mise en place de Flyway
    # Un script déjà appliqué et modifié depuis fait échouer le démarrage plutôt que
    # d'appliquer un schéma qui ne correspond plus à l'historique.
    validate-on-migrate: true
  jpa:
    hibernate:
      # Le schéma vient des migrations Flyway, plus des entités : « update » corrigeait la base
      # en silence à chaque démarrage — une colonne renommée en laissait deux, un type élargi
      # ne revenait jamais en arrière, et aucune trace ne disait qui avait changé quoi.
      # « validate » signale au démarrage tout écart entre les entités et le schéma migré.
      ddl-auto: validate
    # Journalisation des requêtes : coupée par défaut. Chaque requête y passait avec ses
    # valeurs — donc des données de dossiers dans les journaux, et un volume qui noie les
    # lignes qui comptent. Pour déboguer en local : SPRING_JPA_SHOW_SQL=true.
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URI:http://localhost:8080/realms/quali}
      client:
        registration:
          keycloak:
            client-id: ${KC_CLIENT_ID:quali-sira}
            client-secret: ${KC_CLIENT_SECRET:dNQJQsoKafAvG5XvqPgFKY9DGG3lPhRT7P0XhKzQW0DBWa987FaJWmKW3tjpnrt7MzWZ5sLAC7cuWTMHhuHHfM}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KC_TOKEN_URI:http://localhost:8080/realms/quali/protocol/openid-connect/token}
  mail:
    # Serveur de l'organisation. Les valeurs par défaut décrivent l'installation réelle ; seul le
    # mot de passe n'en a pas — une variable manquante fait échouer le démarrage avec un message
    # explicite, plutôt que de laisser le service tourner en n'envoyant rien.
    host: ${MAIL_HOST:mail.qualisira.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:noreply@qualisira.com}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          # Port 465 : SSL implicite — la connexion est chiffrée d'emblée.
          # Port 587 : mettre MAIL_SSL=false et MAIL_STARTTLS=true, la connexion démarre en clair
          # puis se chiffre. Les deux à la fois ne fonctionnent sur aucun des deux ports.
          ssl:
            enable: ${MAIL_SSL:true}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          # Sans délais, un serveur injoignable retient le fil d'envoi jusqu'à celui du système :
          # les courriels ne partaient pas, et rien ne le disait avant plusieurs minutes.
          connectiontimeout: ${MAIL_TIMEOUT_MS:10000}
          timeout: ${MAIL_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_TIMEOUT_MS:10000}

# ===============================
# Gestion des documents (PJ)
# ===============================
  docs:
  pj:
    directory: ${DOCS_PJ_DIRECTORY:${user.home}/PIECES_JOINTES}


# Serveur de fichiers des pièces jointes de la FAQ. Le bloc manquait : sans lui, lib-storage ne
# câblait aucun dépôt et toute pièce jointe répondait 503. Facultatif ici : sans les clés, le
# service démarre et seul le dépôt d'une pièce est refusé.
minio:
  url: ${MINIO_URL:https://s3.horeb.tech}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET_NAME:quali-sira}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

docs:
  pj:
    directory: ./uploads/pj

# ===============================
# Licence de l'installation
# ===============================
qualisira:
  licence:
    # Clé publique de l'éditeur : elle permet de VÉRIFIER une licence, jamais d'en signer une.
    # Sa présence dans le produit livré ne donne donc aucun moyen d'en fabriquer. Elle est
    # fournie par l'outil d'émission (écran « Clé de vérification », ou /actuator/info).
    #
    # SANS VALEUR PAR DÉFAUT, ET C'EST VOULU. Une clé écrite ici valait pour toute installation
    # bâtie depuis ce dépôt : celle du poste de développement partait en production, et si
    # QUALISIRA_CLE_PUBLIQUE y était oubliée, le service démarrait normalement puis refusait
    # TOUTES les licences réelles pour « signature invalide » — une panne qui ne se voit qu'au
    # moment de poser la licence chez le client, et que rien ne relie à sa cause.
    #
    # Vide, le démarrage s'arrête en disant ce qui manque (voir LicenceInstalleeService). Un
    # démarrage qui échoue se remarque dans la minute ; une clé qui ne correspond pas, jamais.
    cle-publique: ${QUALISIRA_CLE_PUBLIQUE:MCowBQYDK2VwAyEA87qUuQOW5599Dy/lJMsjwHXUIwlLVOpx8jrRhpkD/70=}
    # Durée de l'essai gratuit, accordé une seule fois par installation.
    essai-jours: ${QUALISIRA_ESSAI_JOURS:7}
    # Modules ouverts pendant l'essai : ce qui est effectivement proposé à la vente, et non toute
    # l'énumération ModuleAbonnement — qui contient des modules encore à venir. Les ouvrir tous
    # ferait juger l'application sur des écrans vides, puis vivre comme un retrait ce qui n'a
    # jamais été acheté. Élargir l'essai est une décision commerciale : elle se prend ici, sans
    # livrer une version. Un nom inconnu de l'énumération est ignoré, et le journal le dit.
    essai-modules: ${QUALISIRA_ESSAI_MODULES:NON_CONFORMITE,DOCUMENTAIRE}
    # Derniers jours avant le terme, où le rappel d'échéance devient quotidien — terme compris.
    preavis-jours: ${QUALISIRA_PREAVIS_JOURS:3}
    # Rappels isolés, bien avant le terme : un renouvellement demande un devis, une signature et un
    # paiement, que trois jours ne suffisent pas à obtenir. Ils s'ajoutent au préavis quotidien.
    rappels-jalons: ${QUALISIRA_RAPPELS_JALONS:30,15}
    # Code du partenaire chez qui cette installation tourne — « CHU-ABJ », « MINSANTE ». C'est
    # celui que porte la licence, et il est fixé à la livraison.
    #
    # C'est LUI qui rend une licence exclusive à son destinataire. La signature garantit qu'une
    # licence n'a pas été fabriquée ; elle ne dit rien de l'installation qui la présente. Sans ce
    # code, la licence d'un client s'installe chez un autre et y fonctionne pleinement.
    #
    # Laissé vide — le cas normal —, le code est celui posé sur la direction au provisionnement,
    # depuis le champ « code » de tenant-init.json. Cette propriété n'est qu'un recours : elle
    # permet de le corriger sans reconstruire le produit ni toucher à la base. Si ni l'un ni
    # l'autre n'est renseigné, aucun contrôle du destinataire n'est exercé, et le journal le dit.
    partenaire-code: ${QUALISIRA_PARTENAIRE_CODE:}

---
# Appels entre services (Feign) : des délais bornés. Il n'y en avait aucun — un service lent ou
# figé retenait sans fin les fils de tous ceux qui l'appelaient, jusqu'à les bloquer à leur tour.
# 2 s pour joindre, 10 s pour répondre : assez pour un rendu PDF ou une page de référentiel, pas
# pour immobiliser un écran.
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:2000}
            read-timeout: ${FEIGN_READ_TIMEOUT:10000}

---
# Messagerie entre services (ActiveMQ Artemis) : tout ce que le service émet est inscrit dans sa
# boîte d'envoi (message_sortant) puis publié sur le courtier ; le relais, sous verrou ShedLock,
# reprend ce qui n'a pas pu partir. En développement : docker-compose.artemis.yml.
spring:
  artemis:
    mode: native
    broker-url: ${ARTEMIS_URL:tcp://localhost:61617}
    user: ${ARTEMIS_USER:qualisira}
    password: ${ARTEMIS_PASSWORD}
qualisira:
  messagerie:
    relais-ms: ${MESSAGERIE_RELAIS_MS:10000}          # délai entre deux passages du relais
    premier-relais-ms: 15000                           # après le démarrage
    lot: ${MESSAGERIE_LOT:100}                         # messages publiés par passage
    conservation-jours: ${MESSAGERIE_CONSERVATION_JOURS:30}   # puis effacés une fois publiés
    purge-cron: "0 15 3 * * *"
    concurrence: ${MESSAGERIE_CONCURRENCE:1-4}         # consommateurs par file

---
# Surface d'exposition : la sonde de santé, et elle seule, sans détail. Les détails nommaient la
# base, le courtier et l'espace disque — de quoi cartographier l'installation sans s'authentifier.
# La documentation OpenAPI décrit chaque point d'entrée et ses paramètres : coupée par défaut, elle
# se rallume en développement par QUALISIRA_SWAGGER=true (la passerelle l'agrège alors).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: ${QUALISIRA_SWAGGER:false}
  swagger-ui:
    enabled: ${QUALISIRA_SWAGGER:false}
