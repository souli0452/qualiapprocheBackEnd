server:
  port: 8082

spring:
  application:
    name: referentiel-service
  datasource:
    url: jdbc:postgresql://localhost:5433/qualiapproche_referentiel
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/quali
# ===============================
# Gestion des documents (PJ)
# ===============================
  docs:
  pj:
    directory: ${DOCS_PJ_DIRECTORY:${user.home}/PIECES_JOINTES}


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

docs:
  pj:
    directory: ./uploads/pj
