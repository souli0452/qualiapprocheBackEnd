# =====================================================================================
# Réglages du courtier propres à QualiSira — POSTE DE DÉVELOPPEMENT.
#
# C'est ICI que vit le nombre de livraisons avant rebut : la relivraison est décidée par le
# courtier, un client JMS ne peut pas l'imposer. En production, le même bloc se pose dans les
# address-settings du broker.xml (à transmettre à l'exploitation).
#
# L'image recopie etc-override/ dans etc/ À LA CRÉATION DE L'INSTANCE uniquement. Sur une
# instance déjà créée :
#   docker compose -f docker-compose.artemis.yml down
#   rm -rf ~/qualisira/artemis
#   docker compose -f docker-compose.artemis.yml up -d
#
# Vérification, courtier démarré — maxDeliveryAttempts doit ressortir à 300 :
#   curl -s -u qualisira:artemis "http://localhost:8162/console/jolokia/exec/\
# org.apache.activemq.artemis:broker=%220.0.0.0%22/getAddressSettingsAsJSON/qualisira.test"
# =====================================================================================

# Trois cents livraisons, puis le rebut (le défaut d'Artemis est 10). Avec l'attente
# croissante ci-dessous, cela couvre environ trois jours d'indisponibilité d'un consommateur
# — un serveur de messagerie en panne un week-end — sans rien jeter.
addressSettings."qualisira.#".maxDeliveryAttempts=300

# Où atterrit un message qui a épuisé ses livraisons : sans adresse de rebut, il serait jeté.
addressSettings."qualisira.#".deadLetterAddress=DLQ

# Deux secondes avant la première reprise, puis l'attente double à chaque échec, jusqu'à un
# palier de quinze minutes : ni marteler un service qu'on sait éteint, ni retarder la reprise
# d'un incident d'une seconde.
addressSettings."qualisira.#".redeliveryDelay=2000
addressSettings."qualisira.#".redeliveryMultiplier=2.0
addressSettings."qualisira.#".maxRedeliveryDelay=900000
