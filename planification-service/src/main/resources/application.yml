server:
  port: 8081

spring:
  application:
    name: planification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/bd_quali_sira_planification
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/quali

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
