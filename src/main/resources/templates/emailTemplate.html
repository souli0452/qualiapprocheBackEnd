<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="viewport" content="width=device-width">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <style>
    .content, .footer, .logo { text-align: left; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #e1e1e1; position: relative; width: 100%; height: 100vh; font-family: Roboto, sans-serif; }
    h1 { color: gray; font-size: 25px; }
    .content { max-width: 550px; min-height: 550px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 5px; box-shadow: 0 0 10px -10px gray; padding: 2%; }
    .footer img, .logo img { height: 100px; }
    .footer { display: flex; align-items: center; }
    .footer-content { margin-left: 15px; }
    .footer-content span { font-size: 13px; margin-bottom: 15px; position: relative; font-weight: 600; opacity: .7; }
    .footer-content span:after { content: ""; border-bottom: 1px dashed gray; width: 100px; height: 1px; position: absolute; bottom: -8px; left: 0; }
  </style>
</head>
<body style="background:#f7f7f7; padding: 10px; text-align: center; position: relative;">
<div class="content">
  <div class="logo">
    <img src="https://www.finances.gov.bf/fileadmin/user_upload/tof_2.png">
  </div>
  <div class="contenu">
    <h1>Demande de non conformité</h1>
    <p>Cher utilisateur,</p>
    <p>Nous vous informons qu'une non conformité vous a été imputé pour traitement :</p>
    <p><a th:href="${link}" target="_blank">Consulter votre demande</a></p>
    <br />
    <p>Merci de votre confiance !</p>
  </div>
  <br />
  <div class="footer">
    <img src="https://www.finances.gov.bf/fileadmin/user_upload/tof_2.png" alt="footer image">
    <div class="footer-content" style="opacity: 0.7;">
      <span>Burkina Faso</span>
      <span>Direction Générale du Trésor et de la Comptabilité Publique</span>
      <span>DGTCP - Siège social: Ouagadougou</span>
    </div>
  </div>
</div>
</body>
</html>
