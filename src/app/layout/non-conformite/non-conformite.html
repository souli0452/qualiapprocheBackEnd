<div class="card-first p-0 overflow-hidden border-none premium-hub bg-surface-0 dark:bg-surface-900 transition-colors duration-300">
    <!-- Header Premium -->
    <div class="bg-primary-50 dark:bg-surface-800 p-5 flex justify-between items-center border-b border-surface-border">
        <div class="flex items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold m-0 tracking-tight text-surface-900 dark:text-surface-50 flex items-center gap-3">
                    <i class="pi pi-briefcase text-primary dark:text-primary-400"></i>
                    Gestion des Non-Conformités
                </h1>
                <p class="text-surface-500 dark:text-surface-400 mt-1 mb-0">Déclaration, analyse, traitement et suivi des écarts qualité</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <p-button 
                label="Soumettre une NC" 
                icon="pi pi-plus" 
                severity="info" 
                (click)="openSubmitNC()"
                styleClass="shadow-sm font-semibold" />
        </div>
    </div>

    <!-- Navigation Hub (Tabs) -->
    <div class="pt-2 bg-surface-0 dark:bg-surface-900 border-b border-surface-border">
        <p-tabs [value]="activeTab" [scrollable]="true">
            <p-tablist>
                <p-tab *ngFor="let tab of items" [value]="tab.routerLink">
                    <a [routerLink]="tab.routerLink" routerLinkActive="text-primary font-bold" class="flex items-center gap-2 text-inherit no-underline outline-none px-2 py-1">
                        <i [class]="tab.icon"></i>
                        <span class="whitespace-nowrap">{{ tab.label }}</span>
                    </a>
                </p-tab>
            </p-tablist>
        </p-tabs>
    </div>

    <!-- Zone de Contenu Dynamique -->
    <div class="bg-surface-50/50 dark:bg-surface-950/40 min-h-[600px]">
        <div class="bg-surface-0 dark:bg-surface-900 rounded-xl overflow-hidden card">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>

<!-- Popup de Soumission d'une NC -->
<p-dialog [(visible)]="submitNCVisible" 
          [modal]="true" 
          [style]="{ width: '50rem' }"
          [maximizable]="true"
          appendTo="body"
          [header]="'Nouvelle Non-Conformité'"
          styleClass="premium-dialog">
          
    <ng-template pTemplate="header">
        <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-50 dark:bg-red-950/20 rounded-full flex items-center justify-center">
                    <i class="pi pi-exclamation-triangle text-xl text-red-600 dark:text-red-400"></i>
                </div>
                <div>
                    <h5 class="m-0 font-bold text-surface-900 dark:text-surface-50 text-lg">
                        Déclarer une Non-Conformité
                    </h5>
                    <p class="text-xs text-surface-500 dark:text-surface-400 mt-0.5">
                        Renseigner les informations nécessaires pour déclarer un nouvel incident
                    </p>
                </div>
            </div>
        </div>
    </ng-template>

    <div class="p-1">
        <app-nc-compose (closeDialog)="submitNCVisible = false"></app-nc-compose>
    </div>
</p-dialog>
