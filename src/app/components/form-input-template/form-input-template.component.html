<ng-container *ngIf="col.visible" [formGroup]="form">
    <div class="field-container animate-slide-in">

        <!-- 1. Label Supérieur (Optionnel) -->
        <label *ngIf="col.topLabel" [for]="col.field" class="block text-base font-bold text-gray-900 mb-2">
            {{ col.topLabel }}
        </label>

        <!-- 2. Zone Input avec FloatLabel (Obligatoire) -->
        
        <!-- Type String -->
        <ng-container *ngIf="col.type === 'string'">
            <div class="mt-2 w-full">
                <p-floatlabel variant="on" class="w-full block" style="width: 100%;">
                    <input pInputText
                           type="text"
                           [readonly]="col.readonly"
                           [placeholder]="col.placeholder || ''"
                           class="w-full"
                           style="width: 100%;"
                           [formControlName]="col.field"
                           [id]="col.field"
                           autocomplete="off"
                           [attr.aria-describedby]="col.field + '-help'"
                           [name]="col.field" />
                    <label [for]="col.field">
                        {{ col.header }}
                        <span *ngIf="col.required" class="text-red-500 ml-1">*</span>
                    </label>
                </p-floatlabel>
            </div>
        </ng-container>

        <!-- Type Editeur (Garde son style propre) -->
        <ng-container *ngIf="col.type === 'text'">
            <div class="flex flex-col gap-2">
                <label [for]="col.field" class="block text-sm text-gray-600">
                    {{ col.header }}
                    <span *ngIf="col.required" class="text-red-500 ml-1">*</span>
                </label>
                <p-editor [formControlName]="col.field" 
                          [id]="col.field" 
                          [style]="{ height: '70px' }">
                    <ng-template pTemplate="header">
                        <span class="ql-formats">
                            <select class="ql-size"></select>
                            <select class="ql-font"></select>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-bold" aria-label="Bold"></button>
                            <button class="ql-italic" aria-label="Italic"></button>
                            <button class="ql-underline" aria-label="Underline"></button>
                        </span>
                        <span class="ql-formats">
                            <select class="ql-color"></select>
                            <select class="ql-background"></select>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-list" value="ordered" aria-label="Ordered List"></button>
                            <button class="ql-list" value="bullet" aria-label="Bullet List"></button>
                            <select class="ql-align"></select>
                        </span>
                    </ng-template>
                </p-editor>
            </div>
        </ng-container>

        <!-- Type Number -->
        <ng-container *ngIf="col.type === 'number' || col.type === 'float'">
            <div class="mt-2">
                <p-floatlabel variant="on" class="w-full">
                    <p-inputNumber
                        [showButtons]="true"
                        [readonly]="col.readonly"
                        [placeholder]="col.placeholder || ''"
                        [min]="0"
                        mode="decimal"
                        class="w-full"
                        styleClass="w-full"
                        [formControlName]="col.field"
                        [id]="col.field"
                        [name]="col.field">
                    </p-inputNumber>
                    <label [for]="col.field">
                        {{ col.header }}
                        <span *ngIf="col.required" class="text-red-500 ml-1">*</span>
                    </label>
                </p-floatlabel>
            </div>
        </ng-container>

        <!-- Type Dropdown -->
        <ng-container *ngIf="col.type === 'dropdown'">
            <div class="mt-2">
                <p-floatlabel variant="on" class="w-full">
                    <p-multiSelect
                        [options]="dropDownObject[col.field]"
                        [filter]="true"
                        appendTo="body"
                        [optionLabel]="col.optionLabel || 'label'"
                        [optionValue]="col.optionValue || 'value'"
                        [showClear]="true"
                        [formControlName]="col.field"
                        class="w-full"
                        styleClass="w-full"
                        [id]="col.field"
                        [name]="col.field"
                        [selectionLimit]="1"
                        [placeholder]="col.placeholder || ''">
                    </p-multiSelect>
                    <label [for]="col.field">
                        {{ col.header }}
                        <span *ngIf="col.required" class="text-red-500 ml-1">*</span>
                    </label>
                </p-floatlabel>
            </div>
        </ng-container>

        <!-- Type Checkbox -->
        <ng-container *ngIf="col.type === 'boolean'">
            <div class="flex items-center p-2">
                <p-checkbox [binary]="true" [formControlName]="col.field" [id]="col.field"></p-checkbox>
                <label [for]="col.field" class="ml-2 text-gray-700">
                    {{ col.header }}
                    <span *ngIf="col.required" class="text-red-500 ml-1">*</span>
                </label>
            </div>
        </ng-container>

        <!-- Type MultiSelect -->
        <ng-container *ngIf="col.type === 'multiselect'">
            <div class="mt-2">
                <p-floatlabel variant="on" class="w-full">
                    <p-multiSelect
                        [options]="multiSelectObject[col.field]"
                        [filter]="true"
                        appendTo="body"
                        [optionLabel]="col.optionLabel || 'label'"
                        [optionValue]="col.optionValue || 'value'"
                        [showClear]="true"
                        [formControlName]="col.field"
                        class="w-full"
                        styleClass="w-full"
                        [id]="col.field"
                        [name]="col.field"
                        display="chip"
                        [placeholder]="col.placeholder || ''">
                    </p-multiSelect>
                    <label [for]="col.field">
                        {{ col.header }}
                        <span *ngIf="col.required" class="text-red-500 ml-1">*</span>
                    </label>
                </p-floatlabel>
            </div>
        </ng-container>

        <!-- 3. Texte d'aide Inférieur (Optionnel) -->
        <small *ngIf="col.helpText" [id]="col.field + '-help'" class="block mt-1 text-muted-color">
            {{ col.helpText }}
        </small>

    </div>
</ng-container>
