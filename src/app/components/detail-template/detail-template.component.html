
    <h3 class="m-2">{{ title }} </h3>
    <form autocomplete="off" role="form" class="mt-3 ml-2">
        <div class="grid">
            @for (col of cols; track col) {
                <div class="grid col-12">
                    <div class="col-4 md:col-4 sm:col-12">
                        <div class="text-left font-bold">{{ col.header }} :</div>
                    </div>
                    <div class="col-8 md:col-8 sm:col-12">
                        <div class="text-left">
                            {{ rowData[col.field] }}
                        </div>
                    </div>
                </div>
            }
        </div>
    </form>
