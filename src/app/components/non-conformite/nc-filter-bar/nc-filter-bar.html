<div class="flex justify-between items-center gap-3 pt-4 overflow-x-auto whitespace-nowrap hide-scrollbar bg-surface-0 dark:bg-surface-900">
    <!-- Date de début -->
    <div class="filter-item shrink-0">
        <p-floatlabel variant="on" class="w-48">
            <p-datepicker 
                [(ngModel)]="dateDebut" 
                (onChange)="applyFilters()"  
                inputId="start_label" 
                appendTo="body"
                showIcon 
                iconDisplay="input"
                styleClass="w-full border border-surface-border rounded-lg bg-transparent" />
            <label for="start_label">Du</label>
        </p-floatlabel>
    </div>

    <!-- Date de fin -->
    <div class="filter-item shrink-0">
        <p-floatlabel variant="on" class="w-48">
            <p-datepicker 
                [(ngModel)]="dateFin" 
                (onChange)="applyFilters()"  
                [minDate]="dateDebut"
                appendTo="body"
                inputId="end_label" 
                showIcon 
                iconDisplay="input"
                styleClass="w-full border border-surface-border rounded-lg bg-transparent" />
            <label for="end_label">Au</label>
        </p-floatlabel>
    </div>

    <!-- Processus -->
    <div class="filter-item shrink-0" *ngIf="showProcessus">
        <p-floatlabel class="w-56" variant="on">
            <p-select 
                [(ngModel)]="selectedProcess" 
                (onChange)="applyFilters()" 
                inputId="process_label" 
                [showClear]="true" 
                [options]="processusList" 
                [filter]="false" 
                appendTo="body"
                filterBy="libelle" 
                optionLabel="libelle" 
                styleClass="w-full border border-surface-border rounded-lg bg-transparent" 
                variant="filled" />
            <label for="process_label">Processus</label>
        </p-floatlabel>
    </div>

    <!-- Gravité -->
    <div class="filter-item shrink-0" *ngIf="showGravite">
        <p-floatlabel class="w-56" variant="on">
            <p-select 
                [(ngModel)]="selectedGravite" 
                (onChange)="applyFilters()" 
                inputId="gravite_label" 
                [showClear]="true" 
                [options]="graviteList" 
                [filter]="false" 
                appendTo="body"
                filterBy="libelle" 
                optionLabel="libelle" 
                styleClass="w-full border border-surface-border rounded-lg bg-transparent" 
                variant="filled" />
            <label for="gravite_label">Gravité</label>
        </p-floatlabel>
    </div>

    <!-- Origine NC -->
    <div class="filter-item shrink-0" *ngIf="showOrigine">
        <p-floatlabel class="w-56" variant="on">
            <p-select 
                [(ngModel)]="selectedOrigine" 
                (onChange)="applyFilters()" 
                inputId="origine_label" 
                [showClear]="true" 
                [options]="origineList" 
                [filter]="true" 
                appendTo="body"
                filterBy="libelle" 
                optionLabel="libelle" 
                styleClass="w-full border border-surface-border rounded-lg bg-transparent" 
                variant="filled" />
            <label for="origine_label">Origine des NC</label>
        </p-floatlabel>
    </div>

    <!-- Bouton Réinitialiser -->
    <div class="filter-item text-right">
        <p-button label="Réinitialiser" icon="pi pi-refresh" severity="contrast" (click)="resetFilters()" />
    </div>
</div>
