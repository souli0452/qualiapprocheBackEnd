<ng-container>
    <!-- Première ligne : Recherche Direction/Service -->
    <!-- NOTE: Ajoutez *ngIf="!prefilledStructureId" sur la div ci-dessous si la décision finale est de masquer ce bloc -->
    <div *ngIf="!prefilledStructureId" class="flex flex-wrap align-center gap-3 mb-4">
        <!-- Direction -->
        <div class="flex-grow-1" style="flex-basis: 40%; min-width: 300px;">
            <p-select [options]="directions"
                        id="direction"
                        [autoDisplayFirst]="false"
                        emptyMessage="Aucune donnée disponible"
                        emptyFilterMessage="Aucune direction trouvée"
                        appendTo="body"
                        [resetFilterOnHide]="true"
                        [showClear]="true"
                        optionLabel="libelleLong"
                        optionValue="id"
                        placeholder="Rechercher une direction"
                        [filter]="true"
                        [style]="{width: '100%'}"
                        [(ngModel)]="directionId"
                        (onChange)="loadAgents()">
            </p-select>
        </div>
    </div>

    <!-- Header -->
    <div class="flex items-center gap-3 mb-4">
        <div class="flex items-center justify-center rounded-full bg-primary-50" style="width:36px; height:36px;">
            <i class="pi pi-users text-primary"></i>
        </div>
        <div>
            <p class="m-0 font-medium text-900">Recherche d'agent</p>
            <p class="m-0 text-sm text-500">Sélectionnez un agent pour afficher sa fiche</p>
        </div>
    </div>

    <!-- Dropdown -->
    <p-select
        [options]="agents"
        [autoDisplayFirst]="false"
        id="agent"
        (onChange)="onAgentSelect($event.value)"
        emptyMessage="Aucune donnée disponible"
        emptyFilterMessage="Aucun agent trouvé"
        appendTo="body"
        [resetFilterOnHide]="true"
        [showClear]="true"
        optionLabel="label"
        optionValue="value"
        placeholder="Rechercher un agent"
        [filter]="true"
        [style]="{width: '100%'}"
        [(ngModel)]="searchedAgent">
    </p-select>

    <!-- Résultats -->
    <div *ngIf="searchedAgent" class="mt-4">
        <div class="p-4 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col md:flex-row items-center gap-5 hover:shadow-md transition-shadow">
            
            <!-- Avatar -->
            <!-- <div class="flex items-center justify-center bg-indigo-50 dark:bg-indigo-900/30 rounded-full shrink-0" style="width: 40px; height: 40px;">
                <i class="pi pi-user text-indigo-600 dark:text-indigo-400" style="font-size: 1rem;"></i>
            </div> -->
            
            <!-- Informations -->
            <div class="flex-grow text-center md:text-left">
                <div class="flex items-center justify-center md:justify-start gap-2 mb-1">
                    <h4 class="m-0 text-slate-800 dark:text-slate-100 font-bold text-lg tracking-tight">{{ searchedAgent.lastName }} {{ searchedAgent.firstName }}</h4>
                    <i class="pi pi-check-circle text-emerald-500" *ngIf="searchedAgent.enabled" pTooltip="Compte Actif"></i>
                </div>
                
                <div class="flex flex-wrap gap-3 mt-2 items-center justify-center md:justify-start">
                    <!-- <div class="flex items-center gap-2 text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/50 px-3 py-1.5 rounded-lg border border-slate-100 dark:border-slate-700">
                        <i class="pi pi-envelope text-slate-400"></i>
                        <span class="text-sm font-medium">{{ searchedAgent.email || 'Non renseigné' }}</span>
                    </div> -->
                    
                    <!-- <div class="flex items-center gap-2 text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/50 px-3 py-1.5 rounded-lg border border-slate-100 dark:border-slate-700">
                        <i class="pi pi-id-card text-slate-400"></i>
                        <span class="text-sm font-medium">{{ searchedAgent.username || searchedAgent.email }}</span>
                    </div> -->
                </div>
            </div>
            
            <!-- Statut Badge -->
            <div class="flex items-center justify-center md:border-l md:border-slate-200 dark:border-slate-700 md:pl-5 mt-4 md:mt-0 shrink-0">
                <span class="px-3 py-1 text-sm font-semibold rounded-full flex items-center gap-1.5" 
                      [ngClass]="searchedAgent.enabled ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400' : 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'">
                    <span class="w-1.5 h-1.5 rounded-full" [ngClass]="searchedAgent.enabled ? 'bg-emerald-500' : 'bg-red-500'"></span>
                    {{ searchedAgent.enabled ? 'Actif' : 'Inactif' }}
                </span>
            </div>
        </div>

    </div>
</ng-container>
