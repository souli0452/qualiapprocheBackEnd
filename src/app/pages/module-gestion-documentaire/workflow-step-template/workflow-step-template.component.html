<p-toast></p-toast>
<div class="block">
  <div class="col-12">
    <p-toolbar styleClass="mb-4 shadow-1 border-round-xl bg-white">
      <ng-template pTemplate="left">
        <h5 class="m-0 font-bold text-xl text-slate-800">Catalogue d'Étapes</h5>
      </ng-template>
      <ng-template pTemplate="right">
        <button pButton pRipple label="Nouvelle Étape" icon="pi pi-plus" class="p-button-primary p-button-sm"
          (click)="openNew()"></button>
      </ng-template>
    </p-toolbar>

    <app-crud-generic [loading]="loading" [tableCols]="tableCols" [listeObject]="templates" [formGroup]="templateForm"
      [formCols]="[]" [notModif]="true" [notDelete]="true" [isAffich]="false" [asRoleEdit]="true"
      [customButtons]="customButtons" (customActionEvent)="handleCustomAction($event)" [isPagination]="false">
    </app-crud-generic>
  </div>
</div>

<p-dialog [(visible)]="showDialog" [style]="{width: '40rem'}"
  header="{{ isEditMode ? 'Modifier l\'Étape' : 'Nouvelle Étape' }}" [modal]="true" class="p-fluid"
  [breakpoints]="{ '960px': '75vw', '640px': '90vw' }">

  <ng-template pTemplate="content">
    <form [formGroup]="templateForm" class="mt-2">
      <div class="grid grid-cols-12 gap-4">
        <div class="col-span-12">
          <label class="block text-sm font-semibold text-slate-700 mb-1">Nom de l'étape <span class="text-red-500">*</span></label>
          <input pInputText formControlName="nomEtape" placeholder="Ex: Validation RH" class="w-full" />
        </div>
        <div class="col-span-12">
          <label class="block text-sm font-semibold text-slate-700 mb-1">Rôle Responsable / Permission <span class="text-red-500">*</span></label>
          <p-select [options]="rolesList" formControlName="responsableRole" optionLabel="label" optionValue="value"
            placeholder="Sélectionner un rôle ou permission" class="w-full" [filter]="true" [showClear]="true"
            appendTo="body"></p-select>
        </div>
        <div class="col-span-12">
          <label class="block text-sm font-semibold text-slate-700 mb-1">Description</label>
          <textarea pInputTextarea formControlName="description" placeholder="Consigne par défaut..." class="w-full"
            rows="3"></textarea>
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template pTemplate="footer">
    <button pButton pRipple label="Annuler" icon="pi pi-times" class="p-button-text p-button-secondary"
      (click)="hideDialog()"></button>
    <button pButton pRipple label="Enregistrer" icon="pi pi-check" class="p-button-primary shadow-sm"
      [disabled]="templateForm.invalid" [loading]="loading" (click)="saveTemplate()"></button>
  </ng-template>
</p-dialog>

<p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
