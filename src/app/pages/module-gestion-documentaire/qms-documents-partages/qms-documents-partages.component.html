<p-toast></p-toast>
<div class="p-4">
    <div class="card border border-surface-border overflow-hidden">
        <p-table [value]="sharedDocuments" [loading]="loading" [paginator]="true" [rows]="10" styleClass="p-datatable-striped">
            <ng-template pTemplate="header">
                <tr>
                    <th>Numéro</th>
                    <th>Rédacteur</th>
                    <th>Accès</th>
                    <th>Partagé le</th>
                    <th>Partagé par</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-shared>
                <tr>
                    <td class="font-bold">{{ shared.document?.documentNumber }}</td>
                    <td>{{ shared.document?.redacteur }}</td>
                    <td>
                        <span class="px-2 py-1 rounded text-xs font-semibold"
                              [ngClass]="shared.accessRole === 'WRITE' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'">
                            {{ shared.accessRole === 'WRITE' ? 'Modification' : 'Lecture seule' }}
                        </span>
                    </td>
                    <td>{{ shared.grantedAt }}</td>
                    <td>{{ shared.grantedBy }}</td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="5" class="text-center py-5 text-surface-400">
                        <i class="pi pi-share-alt text-5xl mb-3 block"></i>
                        Aucun document partagé avec vous.
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
