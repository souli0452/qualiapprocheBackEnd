<div class="login-container flex min-h-screen">
    <!-- Section Gauche : Logo et Slogan -->
    <div class="hidden lg:flex w-1/2 flex-col justify-center items-center text-white p-12">
        <div class="mb-8">
            <img src="assets/images/logo-white.png" alt="QualiSira Logo" class="w-48 h-auto shadow-2xl rounded-2xl p-4 bg-white/10 backdrop-blur-md">
        </div>
        <h1 class="text-5xl font-extrabold mb-4 tracking-tight">QualiSira</h1>
        <p class="text-2xl font-light opacity-90 italic">"L'excellence au service de la qualité"</p>
    </div>

    <!-- Section Droite : Formulaire -->
    <div class="w-full lg:w-1/2 flex justify-center items-center p-6 bg-white/50 backdrop-blur-sm lg:bg-transparent">
        <p-card class="shadow-2xl border-none">
            
            <form [formGroup]="newPasswordForm" (ngSubmit)="onResetPassword()" class="flex flex-column border-1 border-round-md surface-border surface-card px-3">
                
                <div class="text-center text-[#1e3a5f] text-2xl mb-5 font-bold">
                    Nouveau mot de passe
                </div>

                <div class="w-96">
                    <div class="text-color-secondary mb-6 text-center italic">
                        Veuillez définir votre nouveau mot de passe sécurisé.
                    </div>

                    <!-- Nouveau mot de passe -->
                    <div class="flex flex-col gap-2 text-left mb-4">
                        <label for="password">Mot de passe</label>
                        <span class="p-input-icon-left w-full relative">
                            <i class="pi pi-lock icon-input" style="z-index: 10;"></i>
                            <p-password 
                                id="password" 
                                formControlName="password" 
                                [toggleMask]="true" 
                                [feedback]="true" 
                                placeholder="Tapez votre nouveau mot de passe"
                                styleClass="w-full"
                                [inputStyle]="{'width': '100%'}"
                                [inputStyleClass]="'input-text w-full ' + (newPasswordForm.get('password')?.invalid && newPasswordForm.get('password')?.touched ? 'p-invalid' : '')">
                            </p-password>
                        </span>
                        <small *ngIf="newPasswordForm.get('password')?.touched && newPasswordForm.get('password')?.errors?.['minlength']" class="text-red-500 mt-1">
                            Le mot de passe doit contenir au moins 8 caractères.
                        </small>
                    </div>

                    <!-- Confirmation du mot de passe -->
                    <div class="flex flex-col gap-2 text-left mb-6">
                        <label for="confirmPassword">Confirmer le mot de passe</label>
                        <span class="p-input-icon-left w-full relative">
                            <i class="pi pi-lock-open icon-input" style="z-index: 10;"></i>
                            <p-password 
                                id="confirmPassword" 
                                formControlName="confirmPassword" 
                                [toggleMask]="true" 
                                [feedback]="false" 
                                placeholder="Confirmez votre mot de passe"
                                styleClass="w-full"
                                [inputStyle]="{'width': '100%'}"
                                [inputStyleClass]="'input-text w-full ' + (newPasswordForm.hasError('passwordMismatch') ? 'p-invalid' : '')">
                            </p-password>
                        </span>
                        <small *ngIf="newPasswordForm.hasError('passwordMismatch')" class="text-red-500 mt-1">
                            Les mots de passe ne correspondent pas.
                        </small>
                    </div>

                    <!-- Message d'erreur général -->
                    <div *ngIf="errorMessage" class="text-red-500 text-center mb-4 font-medium bg-red-50 p-2 rounded-lg">
                        {{ errorMessage }}
                    </div>

                    <!-- Bouton de soumission -->
                    <div class="flex flex-col gap-2">
                        <button type="submit" pButton pRipple 
                            class="w-full mb-4 px-5 py-4 font-bold text-lg rounded-full shadow-lg transition-all hover:scale-105" 
                            label="RÉINITIALISER" 
                            [disabled]="newPasswordForm.invalid">
                        </button>
                    </div>
                </div>
            </form>

        </p-card>
    </div>
</div>
