<app-nc-filter-bar (onFilterChange)="handleFilter($event)"></app-nc-filter-bar>
<p-toast />
<div class="shadow-1">

    <app-traitement-table
        *ngIf="demandeList.length > 0"
        [btnActions]="BtnActions.TRAITEMENT"
        [demandeList]="demandeList"
        (onSaveEntity)="saveEntity($event)"
        [cols]="cols"
        (onRejet)="rejet($event)"
        [showGridlines]="false"
        [balanceFrozen]="true" 
        (onSubmission)="submission($event)"
        [loading]="loading"
        [title]="title">
    </app-traitement-table>

    <div *ngIf="nonTraiterData.length > 0" class="mt-4">
        <app-nc-non-traiter [nonTraiterData]="nonTraiterData"></app-nc-non-traiter>
    </div>

    <!-- Empty state si aucune donnée -->
    <div *ngIf="demandeList.length === 0 && nonTraiterData.length === 0 && !loading" 
         class="flex flex-col items-center justify-center py-12 px-4 mt-2 bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-xl shadow-sm text-center">
        <img src="assets/images/empty.svg" 
             alt="Aucune action" 
             class="w-[200px] h-auto mb-6 opacity-60 transition-all duration-300 hover:opacity-80 hover:grayscale-0" 
             style="filter: grayscale(100%);">
        <h3 class="text-2xl font-bold text-surface-900 dark:text-surface-50 mb-3">
            Aucune action à mener
        </h3>
        <p class="text-surface-500 dark:text-surface-400 max-w-2xl leading-relaxed text-lg mb-0 mx-auto">
            Félicitations, vous êtes à jour ! 🎉
        </p>
    </div>
</div>
<app-form-rejet  [motifRejetDialog]="motifRejetDialog" [demande]="demande" (onSuccess)="hideDialog($event)"></app-form-rejet>
