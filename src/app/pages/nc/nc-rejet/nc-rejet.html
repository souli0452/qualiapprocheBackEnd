<p-dialog
    [(visible)]="motifRejetDialog"
    [modal]="true"
    [style]="{ width: '55rem' }"
    [breakpoints]="{ '960px': '95vw' }"
    [draggable]="false"
    [resizable]="false"
    styleClass="premium-dialog">

    <!-- En-tête Premium -->
    <ng-template pTemplate="header">
        <div class="flex items-center gap-3 w-full">
            <div class="w-12 h-12 bg-red-50 dark:bg-red-500/20 rounded-full flex items-center justify-center">
                <i class="pi pi-times-circle text-2xl text-red-600 dark:text-red-400"></i>
            </div>
            <div>
                <h4 class="m-0 font-bold text-surface-900 dark:text-surface-0 text-xl tracking-tight">Rejeter la demande</h4>
                <p class="text-sm text-surface-500 dark:text-surface-400 mt-1 mb-0">
                    Veuillez spécifier le motif détaillé du rejet et joindre d'éventuels fichiers justificatifs.
                </p>
            </div>
        </div>
    </ng-template>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 mt-4">
        <!-- Colonne Gauche : Pièces Jointes -->
        <div class="col-span-12 md:col-span-5">
            <div class="bg-surface-50 dark:bg-surface-800 p-4 rounded-xl border border-surface-200 dark:border-surface-700 h-full flex flex-col">
                <h5 class="text-sm font-semibold mb-3 flex items-center gap-2">
                    <i class="pi pi-paperclip text-primary"></i> Pièces jointes
                </h5>
                <div class="flex-grow">
                    <app-file-upload (fileUploaded)="handleFileUpload($event)"></app-file-upload>
                </div>
            </div>
        </div>

        <!-- Colonne Droite : Motif (P-Editor) -->
        <div class="col-span-12 md:col-span-7 flex flex-col">
            <label for="motif" class="font-semibold text-surface-900 dark:text-surface-0 block mb-2">
                Motif du rejet <span class="text-red-500">*</span>
            </label>
            <div class="flex-grow">
                <p-editor [formats]="[]" id="motif" [(ngModel)]="rejet" [style]="{ height: '220px' }">
                    <ng-template pTemplate="header">
                        <span class="ql-formats">
                            <select class="ql-size"></select>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-bold" aria-label="Bold"></button>
                            <button class="ql-italic" aria-label="Italic"></button>
                            <button class="ql-underline" aria-label="Underline"></button>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-list" value="ordered"></button>
                            <button class="ql-list" value="bullet"></button>
                        </span>
                    </ng-template>
                </p-editor>
            </div>
        </div>
    </div>

    <!-- Pied de page -->
    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-3 pt-4 border-t border-surface-200 dark:border-surface-700 w-full mt-4" *ngIf="!isSummited">
            <button pButton pRipple type="button" label="Annuler" icon="pi pi-times" 
                    class="p-button-text p-button-secondary font-semibold" (click)="hideDialog()">
            </button>
            <button pButton pRipple type="button" label="Confirmer le rejet" icon="pi pi-check" 
                    class="p-button-danger font-bold" [disabled]="!rejet" (click)="rejetDemande()">
            </button>
        </div>
    </ng-template>
</p-dialog>
