
<p-toast />
<div class="card shadow-1">
    <app-traitement-table
        [btnActions]="BtnActions.VALIDATION"
        [demandeList]="demandeList"
        [cols]="cols"
        (onRejet)="rejet($event)"
        (onValidation)="validation($event)"

        [title]="title">

</div>
