<div class="shadow-1">
    <p-toast />
    <app-traitement-table
        [btnActions]="BtnActions.VALIDATION_RS"
        [demandeList]="demandeList"
        (onValidationRS)="validationRs($event)"
        (onCloture)="cloture($event)"
        [cols]="cols"
        (onRejet)="rejet($event)"
        [loading]="loading"
        [paginator]="false" 
        [showGridlines]="false"
        [title]="title">
    </app-traitement-table>
</div>
<app-nc-rejet  [motifRejetDialog]="motifRejetDialog" [demande]="demande" (onSuccess)="hideDialog($event)"></app-nc-rejet>
