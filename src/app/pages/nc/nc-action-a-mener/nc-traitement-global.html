<p-toast />
<div class="bg-surface-100 mb-4 p-2 text-center">
    <div class="text-xl mb-2 font-bold">Traitement des non-conformités</div>
    <p>Espace dédié au traitement des non-conformités. Vous trouverez les Non-Conformités qui vous ont été imputées oú celles dont le traitement n'a pas été validé.</p>
</div>

<app-nc-filter-bar 
    (onFilterChange)="handleFilter($event)"
    [showProcessus]="false"
    [showOrigine]="false"
    ></app-nc-filter-bar>

<p-toast />
<div class="shadow-1">

    <app-traitement-table
        *ngIf="mesNonConformites.length > 0"
        [btnActions]="BtnActions.TRAITEMENT"
        [demandeList]="mesNonConformites"
        (onSaveEntity)="saveEntity($event)"
        [cols]="cols"
        [paginator]="false"
        [showGridlines]="false"
        [balanceFrozen]="true" 
        (onSubmission)="submission($event)"
        [loading]="loading"
        [title]="title"
        (pageChangeEvent)="onPageChange($event)"
        [totalElements]="totalElements"
        [pageSize]="pageSize"
        [currentPage]="currentPage">
    </app-traitement-table>

    <!-- Empty state si aucune donnée -->
    <div *ngIf="mesNonConformites.length === 0 && nonTraiterData.length === 0 && !loading" 
         class="flex flex-col items-center justify-center p-4 mt-2 bg-surface-0 dark:bg-surface-900 text-center">
        <img src="assets/images/empty.svg" 
             alt="Aucune action" 
             class="w-[200px] h-auto mb-6 opacity-60 transition-all duration-300 hover:opacity-80 hover:grayscale-0" 
             style="filter: grayscale(100%);">
        <h3 class="text-2xl font-bold text-surface-900 dark:text-surface-50 mb-3">
            Aucune action à mener
        </h3>
        <p class="text-surface-500 dark:text-surface-400 max-w-2xl leading-relaxed text-lg mb-0 mx-auto">
            Félicitations, vous êtes à jour ! 🎉
        </p>
    </div>
</div>
