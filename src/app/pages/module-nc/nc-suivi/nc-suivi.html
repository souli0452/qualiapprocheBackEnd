<app-nc-filter-bar (onFilterChange)="handleFilter($event)"></app-nc-filter-bar>
<p-divider />
<div class=" shadow-1">
    <app-traitement-table
        [btnActions]="BtnActions.CLOTURE"
        [demandeList]="demandeList"
        [cols]="cols"
        (onEdition)="edition($event)"
        [loading]="loading"
        [paginator]="false"
        [showGridlines]="false"
        (onCloture)="cloture($event)"
        [totalElements]="totalElements"
        [currentPage]="currentPage"
        [pageSize]="pageSize"
        (pageChangeEvent)="onPageChange($event)"
        >
    </app-traitement-table>
</div>

<div *ngIf="demandeList.length === 0 && !loading" 
      class="flex flex-col items-center justify-center p-4 mt-2 bg-surface-0 dark:bg-surface-900 text-center">
    
    <img src="assets/images/empty.svg" 
          alt="Aucune Non-Conformité" 
          class="w-[200px] h-auto mb-6 opacity-60 transition-all duration-300 hover:opacity-80 hover:grayscale-0" 
          style="filter: grayscale(100%);">
    
    <!-- Titre accrocheur -->
    <h3 class="text-2xl font-bold text-surface-900 dark:text-surface-50 mb-3">
        Aucune Non-Conformité disponible
    </h3>
    
    <p class="text-surface-500 dark:text-surface-400 max-w-2xl leading-relaxed text-lg mb-0 mx-auto">
        Aucune non-conformité disponible à ce jour.
    </p>

</div>
