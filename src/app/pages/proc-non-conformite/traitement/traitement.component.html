<p-toast />
<div class="card shadow-1">

    <app-dmd-traitement-table-template
        [btnActions]="BtnActions.TRAITEMENT"
        [demandeList]="demandeList"
        (onSaveEntity)="saveEntity($event)"
        [cols]="cols"
        (onRejet)="rejet($event)"
        (onSubmission)="submission($event)"
        [title]="title">
    </app-dmd-traitement-table-template>
</div>
<app-rejet  [motifRejetDialog]="motifRejetDialog" [demande]="demande" (onSuccess)="hideDialog($event)"></app-rejet>
