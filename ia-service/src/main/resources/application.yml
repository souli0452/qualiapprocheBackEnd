server:
  port: 8091

spring:
  application:
    name: ia-service
  # Aucun secret ne porte de valeur par défaut : une variable d'environnement manquante fait
  # échouer le démarrage avec un message explicite, plutôt que de laisser le service tourner
  # avec des identifiants versionnés. Voir .env.example pour la liste à renseigner.
  datasource:
    url: ${DB_URL_IA:jdbc:postgresql://localhost:5432/qualisira_ia}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Une base déjà en service n'est pas vide : Flyway la marque « v1 » au lieu de rejouer
    # le schéma initial, qui échouerait sur des tables existantes. Une base vide, elle,
    # reçoit V1 puis la suite. Les deux convergent ensuite.
    baseline-on-migrate: true
    baseline-version: 1
    # Sans apostrophe : Flyway interpole cette description dans le SQL qui inscrit la
    # ligne de référence, et une apostrophe y casse la migration au premier démarrage.
    baseline-description: Schema initial releve avant la mise en place de Flyway
    # Un script déjà appliqué et modifié depuis fait échouer le démarrage plutôt que
    # d'appliquer un schéma qui ne correspond plus à l'historique.
    validate-on-migrate: true
  jpa:
    hibernate:
      # Le schéma vient des migrations Flyway, plus des entités : « update » corrigeait la base
      # en silence à chaque démarrage — une colonne renommée en laissait deux, un type élargi
      # ne revenait jamais en arrière, et aucune trace ne disait qui avait changé quoi.
      # « validate » signale au démarrage tout écart entre les entités et le schéma migré.
      ddl-auto: validate
    # Journalisation des requêtes : coupée par défaut. Chaque requête y passait avec ses
    # valeurs — donc des données de dossiers dans les journaux, et un volume qui noie les
    # lignes qui comptent. Pour déboguer en local : SPRING_JPA_SHOW_SQL=true.
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URI:http://localhost:8080/realms/quali}
      # Réservé aux appels sortants en client_credentials (Feign), lorsque le service devra
      # consulter les services métier sans requête utilisateur à l'origine.
      client:
        registration:
          keycloak:
            client-id: ${KC_CLIENT_ID:quali-sira}
            client-secret: ${KC_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KC_TOKEN_URI:http://localhost:8080/realms/quali/protocol/openid-connect/token}
  ai:
    openai:
      # Fournisseur OpenAI-compatible : Mistral cloud (valeur par défaut ci-dessous), OpenAI,
      # ou un Ollama auto-hébergé (base-url http://localhost:11434 et modèle local). La clé
      # n'a aucune valeur par défaut : sans IA_API_KEY, le démarrage échoue explicitement.
      base-url: ${IA_BASE_URL:https://api.mistral.ai}
      api-key: ${IA_API_KEY}
      chat:
        options:
          model: ${IA_MODEL:mistral-small-latest}
    # Nouvel essai unique sur une erreur passagère (429, 5xx) : le défaut du starter est de dix
    # tentatives à backoff exponentiel, ce qui retiendrait la requête des minutes — au-delà du
    # délai de la passerelle — quand le fournisseur est franchement en panne.
    retry:
      max-attempts: ${IA_MAX_ATTEMPTS:2}

ia:
  assistant:
    # Bornes de génération de l'assistant : assez pour une description de non-conformité ou un
    # plan d'action structuré, assez peu pour qu'une boucle ne brûle pas le forfait.
    max-tokens: ${IA_MAX_TOKENS:1200}
    # L'assistant rédige des documents qualité, pas des fictions : une température basse garde
    # le ton normatif et évite l'invention de faits.
    temperature: ${IA_TEMPERATURE:0.3}
    # Délai maximal d'une lecture sur le fournisseur, en millisecondes. Un modèle lent doit
    # échouer en 504 franc plutôt que de retenir la requête jusqu'au délai du système.
    timeout-ms: ${IA_TIMEOUT_MS:45000}
    # Budget quotidien de jetons par direction (par utilisateur si le jeton ne porte pas de
    # direction) : le plafond qui empêche une boucle ou un usage massif de brûler le forfait en
    # une journée. Zéro ou valeur négative = illimité.
    budget-jetons-jour: ${IA_BUDGET_JETONS_JOUR:200000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
