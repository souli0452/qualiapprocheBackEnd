server:
  port: 8088

spring:
  application:
    name: contexte-service
  datasource:
    url: jdbc:postgresql://localhost:5433/qualiapproche_contexte
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/quali-approche

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
