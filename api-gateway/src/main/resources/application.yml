server:
  port: 8088

spring:
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 1048576000
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/**
          filters:
            - RewritePath=/user-service/(?<segment>.*), /${segment}
            
        - id: referentiel-service
          uri: lb://REFERENTIEL-SERVICE
          predicates:
            - Path=/referentiel-service/**
          filters:
            - RewritePath=/referentiel-service/(?<segment>.*), /${segment}
            
        - id: amelioration-service
          uri: lb://AMELIORATION-SERVICE
          predicates:
            - Path=/amelioration-service/**
          filters:
            - RewritePath=/amelioration-service/(?<segment>.*), /${segment}

        - id: support-service
          uri: lb://SUPPORT-SERVICE
          predicates:
            - Path=/support-service/**
          filters:
            - RewritePath=/support-service/(?<segment>.*), /${segment}

        - id: evaluation-service
          uri: lb://EVALUATION-SERVICE
          predicates:
            - Path=/evaluation-service/**
          filters:
            - RewritePath=/evaluation-service/(?<segment>.*), /${segment}

        - id: realisation-service
          uri: lb://REALISATION-SERVICE
          predicates:
            - Path=/realisation-service/**
          filters:
            - RewritePath=/realisation-service/(?<segment>.*), /${segment}

        - id: planification-service
          uri: lb://PLANIFICATION-SERVICE
          predicates:
            - Path=/planification-service/**
          filters:
            - RewritePath=/planification-service/(?<segment>.*), /${segment}

        - id: contexte-service
          uri: lb://CONTEXTE-SERVICE
          predicates:
            - Path=/contexte-service/**
          filters:
            - RewritePath=/contexte-service/(?<segment>.*), /${segment}

        - id: workflow-service
          uri: lb://WORKFLOW-SERVICE
          predicates:
            - Path=/workflow-service/**
          filters:
            - RewritePath=/workflow-service/(?<segment>.*), /${segment}

        - id: ia-service
          uri: lb://IA-SERVICE
          predicates:
            - Path=/ia-service/**
          filters:
            - RewritePath=/ia-service/(?<segment>.*), /${segment}

springdoc:
  # L'interface Swagger agrégée décrit chaque point d'entrée de chaque service : une carte offerte à
  # qui la trouve, et un scanner de sécurité la relève au premier passage. Coupée par défaut ;
  # QUALISIRA_SWAGGER=true la rouvre sur un poste de développement.
  api-docs:
    enabled: ${QUALISIRA_SWAGGER:false}
  swagger-ui:
    enabled: ${QUALISIRA_SWAGGER:false}
    urls:
      - name: referentiel-service
        url: /referentiel-service/v3/api-docs
      - name: user-service
        url: /user-service/v3/api-docs
      - name: amelioration-service
        url: /amelioration-service/v3/api-docs
      - name: support-service
        url: /support-service/v3/api-docs
      - name: evaluation-service
        url: /evaluation-service/v3/api-docs
      - name: realisation-service
        url: /realisation-service/v3/api-docs
      - name: planification-service
        url: /planification-service/v3/api-docs
      - name: contexte-service
        url: /contexte-service/v3/api-docs
      - name: workflow-service
        url: /workflow-service/v3/api-docs
      - name: ia-service
        url: /ia-service/v3/api-docs

qualisira:
  cors:
    # Origines autorisées à appeler la passerelle depuis un navigateur. Elles étaient écrites en
    # dur dans CorsConfig : changer le domaine du frontal imposait de reconstruire l'image, et
    # jusque-là la connexion échouait sur une erreur qui parle de CORS sans nommer l'origine
    # attendue.
    #
    # Vide par défaut : c'est le motif ci-dessous qui ouvre. À renseigner pour n'admettre que des
    # origines nommées — et alors vider « motifs-origines ».
    origines: ${QUALISIRA_CORS_ORIGINES:}

    # Motifs : les frontaux où le produit est servi, nommés un à un — app.test.qualisira.com, le
    # frontal de test, qui appelle api-gateway.test.qualisira.com — et le poste de développement sur
    # localhost, quel qu'en soit le port. Ni qualisira.test.qualisira.com ni qualisira.horeb.tech :
    # aucun des deux ne résout ; ni qualisira.com, qui sert le site vitrine. Pas de motif
    # « *.horeb.tech » ni « *.qualisira.com » : un domaine entier rend fiable tout hôte qui y sert du
    # contenu déposé (s3.horeb.tech, le stockage MinIO, en est un), et une page posée là agirait au
    # nom de l'utilisateur connecté. Pour un nouveau frontal, surcharger par
    # QUALISIRA_CORS_MOTIFS_ORIGINES en le nommant et en recopiant la liste ci-dessous : la variable
    # la remplace, elle ne s'y ajoute pas.
    #
    # Le défaut était « * » : n'importe quel site visité par un utilisateur connecté pouvait appeler
    # cette API avec ses cookies de session (SameSite=None), et donc agir en son nom. Le joker reste
    # possible pour un environnement de test — un avertissement le signale alors à chaque démarrage.
    #
    # Un motif, et non une origine exacte, pour le port variable du poste de développement. Avec
    # identifiants (notre cookie), la norme refuse « * » comme origine ; un motif fait renvoyer
    # l'origine réellement appelante, ce qu'elle accepte.
    #
    # La même liste sert au filtre anti-CSRF (FiltreAntiCsrf) : une écriture venue d'une origine
    # qu'elle ne couvre pas est refusée.
    motifs-origines: ${QUALISIRA_CORS_MOTIFS_ORIGINES:https://app.test.qualisira.com,http://localhost:[*],http://127.0.0.1:[*]}

  # Limitation du rythme des appels d'authentification, par adresse cliente (FiltreLimiteDeDebit).
  # En mémoire : la passerelle tourne en un seul exemplaire.
  limites:
    actif: ${QUALISIRA_LIMITES_ACTIF:true}
    # Nombre de mandataires à nous devant la passerelle (Traefik du déploiement : 1). L'adresse
    # cliente est lue dans X-Forwarded-For à ce rang en partant de la fin — le début de la liste
    # est écrit par le client et ne prouve rien. 0 : l'en-tête est ignoré, l'adresse de la
    # connexion fait foi.
    sauts-de-confiance: ${QUALISIRA_LIMITES_SAUTS_DE_CONFIANCE:1}
    taille-max: 100000
    regles:
      # Une organisation entière sort souvent par une seule adresse publique : le seuil doit
      # absorber l'arrivée du matin, tout en rendant vain l'essai de mots de passe en série.
      connexion:
        chemins:
          - /user-service/api/v1/login
        capacite: ${QUALISIRA_LIMITE_CONNEXION:20}
        periode: 1m
      # Le frontal rafraîchit seul la session à chaque expiration du jeton, pour chaque onglet :
      # un seuil trop bas déconnecterait des utilisateurs qui n'ont rien fait.
      rafraichissement:
        chemins:
          - /user-service/api/v1/refresh
        capacite: ${QUALISIRA_LIMITE_RAFRAICHISSEMENT:60}
        periode: 1m
      # Chaque appel envoie un courriel : c'est ici qu'un abus coûte le plus — et qu'il vise un
      # collaborateur, dont la boîte se remplirait de liens qu'il n'a pas demandés.
      reinitialisation:
        chemins:
          - /user-service/api/v1/initiate-reset-pwd
        capacite: ${QUALISIRA_LIMITE_REINITIALISATION:5}
        periode: 1m
      # Ce qui éprouve un secret sans passer par la connexion : l'ancien mot de passe
      # (update-pwd), le jeton reçu par courriel (reinitialize-pwd, verify-email). Laissés sans
      # limite, ils offraient un second guichet à l'essai de mots de passe en série.
      mot-de-passe:
        chemins:
          - /user-service/api/v1/update-pwd
          - /user-service/api/v1/reinitialize-pwd
          - /user-service/api/v1/verify-email
        capacite: ${QUALISIRA_LIMITE_MOT_DE_PASSE:10}
        periode: 1m

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

gateway:
  # Durée de mise en cache (par token) des permissions applicatives résolues via user-service
  # avant de les ré-interroger. Voir AuthCookieFilter / UserPermissionsCache.
  permissions-cache-ttl-seconds: ${GATEWAY_PERMISSIONS_CACHE_TTL_SECONDS:60}

  # Durée de mise en cache de l'état de la licence. Une licence ne change qu'à son installation :
  # une minute de retard au plus, contre un appel au référentiel à chaque requête.
  licence-cache-ttl-seconds: ${GATEWAY_LICENCE_CACHE_TTL_SECONDS:60}

  licence:
    # Chemins soustraits au contrôle, même en écriture : tout ce sans quoi une installation
    # expirée ne pourrait plus jamais être réactivée. Se connecter et poser une licence doivent
    # rester possibles, sinon le blocage se retourne contre nous.
    #
    # Reprendre la main sur son propre compte en fait partie. `initiate-reset-pwd` envoie le
    # courriel, `reinitialize-pwd` pose le nouveau mot de passe : exempter la première sans la
    # seconde laissait la réinitialisation à mi-chemin, le lien reçu menant à un refus. Et
    # `update-pwd` sert le mot de passe temporaire de la première connexion — le refuser
    # enfermerait dehors l'administrateur venu poser la licence.
    #
    # `/users/reset-password` n'y figure volontairement pas : un administrateur qui réinitialise
    # le mot de passe d'un tiers administre des comptes, il ne récupère pas son accès.
    exemptions:
      - /user-service/api/v1/login
      - /user-service/api/v1/logout
      - /user-service/api/v1/refresh
      - /user-service/api/v1/initiate-reset-pwd
      - /user-service/api/v1/reinitialize-pwd
      - /user-service/api/v1/update-pwd
      - /referentiel-service/api/v1/licence

    # Module exigé selon le début du chemin ; le préfixe le plus long l'emporte. Les réclamations
    # et les risques vivent dans le même service que les non-conformités, et relèvent pourtant de
    # modules distincts — d'où les préfixes fins.
    #
    # Un chemin qui ne figure pas ici n'exige aucun module : seule la validité de la licence est
    # vérifiée. C'est le cas de la configuration, des utilisateurs et du moteur de workflow, qui
    # sert tous les modules à la fois.
    modules:
      /amelioration-service/api/v1/reclamation: RECLAMATION
      /amelioration-service/api/v1/risque: RISQUE
      /amelioration-service: NON_CONFORMITE
      /support-service: DOCUMENTAIRE
      /referentiel-service/api/v1/formation: FORMATION
      /referentiel-service/api/v1/fournisseur: FORMATION
      /referentiel-service/api/v1/exigence: REGLEMENTATION
      # L'échelle et les critères d'évaluation des auditeurs se paramètrent dans referentiel-service,
      # mais ne servent que le module d'audit. Les sites, partagés, n'exigent aucun module.
      /referentiel-service/api/v1/criteres-evaluation-auditeur: AUDIT
      /referentiel-service/api/v1/niveaux-evaluation-auditeur: AUDIT
      # Le module d'audit vit dans evaluation-service depuis qu'il a quitté planification-service :
      # c'est AUDIT qu'il exige, et non EVALUATION — qui, côté front, ne désigne que les critères
      # d'évaluation. Sans cela, une direction abonnée à l'audit se voyait refuser ses audits, et
      # une direction abonnée aux seuls critères les obtenait.
      /evaluation-service/api/v1/critere-evaluation: EVALUATION
      /evaluation-service: AUDIT
      /contexte-service: CONTEXTE
      /ia-service: ASSISTANT_IA
