server:
  port: 8092

spring:
  application:
    name: workflow-service
  # Aucun secret ne porte de valeur par défaut : une variable d'environnement manquante fait
  # échouer le démarrage avec un message explicite, plutôt que de laisser le service tourner
  # avec des identifiants versionnés. Voir .env.example pour la liste à renseigner.
  datasource:
    url: ${DB_URL_WORKFLOW:jdbc:postgresql://localhost:5432/qualisira_workflowdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URI:http://localhost:8080/realms/quali}
      # Utilisé par FeignConfig pour authentifier les webhooks émis hors requête utilisateur
      # (notifications publiées après commit d'une transition).
      client:
        registration:
          keycloak:
            client-id: ${KC_CLIENT_ID:quali-sira}
            client-secret: ${KC_CLIENT_SECRET:URd095w8aGdw1wJ53HLDd1cxkvJEJReC}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KC_TOKEN_URI:http://localhost:8080/realms/quali/protocol/openid-connect/token}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:tachquali@gmail.com}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

workflow:
  notifications:
    # Lien inséré dans les courriels d'étape. {resourceType} et {resourceId} y sont substitués.
    # Laissé vide, les courriels partent sans lien plutôt qu'avec un lien mort : la route
    # appartient au frontal, ce service ne peut pas la deviner. À renseigner après vérification
    # de la navigation réelle.
    motif-lien: ${WORKFLOW_LIEN_MOTIF:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
